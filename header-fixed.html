<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial Headers - Hamburger</title>
    <link rel="stylesheet" href="./css/header-fixed.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="description"
        content="Guida completa agli header in HTML e CSS. Scopri come creare header accattivanti e funzionali per il tuo sito web.">
    <meta name="keywords" content="HTML, CSS, header, tutorial, web design">
    <meta name="author" content="raffaccio">
    <script src="./js/header-fixed.js" defer></script>
</head>

<body>
    <header class="ham-header">
        <div class="logo">
            <a href="index.html" class="logo-link" aria-label="Torna alla home">
                <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                    <style>
                        .outer {
                            fill: rgba(0, 115, 230, 0.5);
                            stroke: transparent;
                            stroke-width: 3;
                            transition: stroke 0.4s ease, stroke-dashoffset 0.4s ease;
                            stroke-dasharray: 300;
                            stroke-dashoffset: 300;
                        }

                        .inner {
                            fill: rgba(0, 115, 230, 0.3);
                        }

                        svg:hover .outer {
                            stroke: rgba(255, 255, 255, 0.7);
                            stroke-dashoffset: 0;
                        }
                    </style>
                    <rect class="outer" x="10" y="10" width="80" height="80" rx="10" ry="10" />
                    <rect class="inner" x="20" y="20" width="60" height="60" rx="15" ry="15" />
                </svg>
            </a>
            <h1>Header con transizioni di immagini .svg</h1>
        </div>

        <div class="hamburger" aria-label="Apri menu">
            <img src="./images/hamburger-icon.svg" alt="Menu" class="hamburger-icon">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <nav class="nav-menu">
            <a href="header-home.html">Header Home</a>
            <a href="headers.html">Headers HQ</a>
        </nav>
    </header>
    <nav class="sub-header">
        <ul>
            <li><a href="header-fixed.html">Header Fisso</a></li>
            <li><a href="header-modern.html">Header Moderno</a></li>
        </ul>
</body>
</html>
