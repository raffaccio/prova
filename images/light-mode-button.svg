<svg width="200" height="80" xmlns="http://www.w3.org/2000/svg" aria-label="Attiva modalità chiara">
  <rect class="outer" x="5" y="5" width="190" height="70" rx="15" ry="15" fill="rgba(0, 115, 230, 0.5)" />
  <rect class="inner" x="15" y="15" width="170" height="50" rx="10" ry="10" fill="rgba(0, 115, 230, 0.3)" />
  <text x="100" y="45" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Arial" dominant-baseline="middle">
    Light Mode
  </text>
  <!-- Sole -->
  <circle cx="160" cy="30" r="8" fill="rgba(255, 255, 255, 0.3)" />
  <line x1="160" y1="15" x2="160" y2="5" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  <line x1="160" y1="45" x2="160" y2="55" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  <line x1="145" y1="30" x2="135" y2="30" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
  <line x1="175" y1="30" x2="185" y2="30" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
</svg>
<!-- This SVG represents a button to activate light mode with a sun icon -->
<!-- The button has rounded corners and a light blue color scheme -->